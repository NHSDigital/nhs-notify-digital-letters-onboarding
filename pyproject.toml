[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "nhs-notify-digital-letters-onboarding"
version = "0.1.0"
description = "JSON Schema for NHS Notify Digital Letters DocumentReference payloads"
requires-python = ">=3.11"
dependencies = [
    "jsonschema>=4.0",
    "PyYAML>=6.0",
]

[tool.setuptools]
packages = ["nhs_notify_onboarding"]
include-package-data = true

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
nhs_notify_onboarding = ["*.yaml"]
